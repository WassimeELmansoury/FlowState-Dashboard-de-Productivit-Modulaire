<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FlowState</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="bg-gray-100 flex justify-center">
    <div class="w-full max-w-md lg:max-w-5xl bg-white min-h-screen shadow-lg flex flex-col">
    
        <header class="p-6 flex items-center gap-4">
          <button class="hover:bg-gray-100 p-2 rounded-lg transition">
            <i class="fa-solid fa-bars text-2xl"></i>
          </button>
          <h1 class="font-bold text-2xl text-gray-800">Pomodoro Timer</h1>
        </header>
    
        <main class="flex-1 px-6 py-10 pb-24">
    
          <section class="mb-8">
            <h3 class="text-gray-500 text-lg mb-3">Hello Pratham</h3>
    
            <div class="flex items-center gap-4 bg-[#FDDDCA] p-4 rounded-xl">
            <div class="w-20 h-20 flex items-center justify-center bg-white rounded-full border-4 border-gray-800 font-bold">
                72%
            </div>
    
    
              <p class="text-gray-800 font-medium text-sm">
                Boost up your energy and start again to achieve
              </p>
            </div>
          </section>
        
        <section>
            <h2 class="font-bold text-xl text-gray-800 mb-4">Today's Task</h2>
            <div id="tasksContainer" class="space-y-4"></div>
        </section>

        </main>
    
        <footer class="fixed bottom-0 left-0 w-full bg-[#E5E5E5] py-4 px-6 flex justify-around border-t">
            <i class="fa-solid fa-house text-2xl text-[#50361E]"></i>
            <i class="fa-solid fa-clipboard-list text-2xl text-[#50361E]"></i>
            <div onclick="goToTimer()" class="bg-[#FF7A00] p-3 rounded-full cursor-pointer">
              <i class="fa-solid fa-stopwatch text-white text-2xl"></i>
            </div>
      
      
            <i class="fa-solid fa-tree text-2xl text-[#50361E]"></i>
            <i class="fa-solid fa-user text-2xl text-[#50361E]"></i>
        </footer>
    </div>
</body>
<script src="Script.js"></script>
</html>
